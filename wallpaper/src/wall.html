<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GestureWall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* A wallpaper has no cursor of its own; the system one belongs to whatever is
     in front. Hiding it also stops a stray arrow from sitting on the desktop when
     the mouse is used to drive the wall during development. */
  body { cursor: default; }
  #stage { display: block; width: 100vw; height: 100vh; }

  /* Placeholder shown when no images are set, so a fresh install looks
     deliberate rather than broken. */

  #hud {
    position: fixed; left: 18px; top: 18px; z-index: 10;
    font: 500 12px/1.65 ui-monospace, SFMono-Regular, monospace;
    color: rgba(255,255,255,.9); background: rgba(8,9,12,.62);
    padding: 12px 14px; border-radius: 10px; backdrop-filter: blur(9px);
    max-width: 46ch; pointer-events: none;
    border: 1px solid rgba(255,255,255,.08);
  }
  #hud b { color: #9fe6ff; }
  #hud .note { color: #ffd48a; }
  #hud .ok { color: #8affc1; }
  #hud .keys { color: rgba(255,255,255,.45); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>

  <script src="vendor/three.r128.min.js"></script>
  <script src="system.js"></script>
  <script src="templates.js"></script>
  <script src="layers.js"></script>
  <script src="mood.js"></script>
  <script src="wall.js"></script>
</body>
</html>
