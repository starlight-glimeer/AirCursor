<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GestureWall Video</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* object-fit: cover —— 视频比例和屏幕不一样时铺满而不是留黑边。
     壁纸宁可裁掉边缘也不该露出黑框。 */
  video, img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* 默认都藏起来，由 JS 按类型显示一个 —— 免得两个都占位。 */
  video, img { display: none; }
  video.on, img.on { display: block; }

  /* 出错时的兜底显示。⚠️ 存在的理由：黑屏有五种原因（文件找不到、编解码不支持、
     protocol 没通、在放但看不见、真的是黑色画面），而它们长得一模一样。
     这一层把"放不了"和"放了但你看不见"分开 —— 那是两种完全不同的修法。 */
  #err {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 40px; text-align: center;
    font: 400 14px/1.8 -apple-system, "PingFang SC", sans-serif;
    color: #ffb4b4; background: #14100f;
  }
  #err.on { display: flex; }
  #err b { color: #fff; font-size: 16px; }
  #err .detail { color: rgba(255,255,255,.5); font-size: 12px; font-family: ui-monospace, monospace; }
  /* ⚠️⚠️ `white-space: pre-line` —— 提示里的 `\n` 要靠它才真的换行。
     没有它的话整段挤成一坨（用户 2026-08-02 的截图就是那样，
     那条 ffmpeg 命令被折断在句子中间，复制出来是错的）。
     ⚠️ 而 `pre-line` 而不是 `pre`：前者仍然会把长行按容器宽度折行，
     后者会让长命令溢出屏幕。 */
  #err .hint {
    color: rgba(255,180,180,.72); font-size: 12.5px; max-width: 40em;
    white-space: pre-line; text-align: left; line-height: 1.9;
  }
  /* ⚠️ 命令那行要能看清是命令 —— 它混在中文里的话用户不知道该复制哪一段 */
  #err .hint { font-family: -apple-system, "PingFang SC", sans-serif; }
</style>
</head>
<body>
  <video id="v" autoplay loop muted playsinline></video>
  <!-- 图片/GIF 用同一个容器逻辑（铺满、cover）。两个标签共存、按类型显示哪个 ——
       比两套页面少一份要同步的代码。⚠️ GIF 的循环由浏览器自己管，不需要 loop 属性。 -->
  <img id="i" alt="">
  <div id="err">
    <b id="err-title">放不出来</b>
    <div class="detail" id="err-detail"></div>
    <div class="hint" id="err-hint"></div>
  </div>
  <script src="video.js"></script>
</body>
</html>
