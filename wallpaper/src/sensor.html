<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GestureWall Sensor</title>
<style>
  body { margin: 0; background: #111; }
  /* Kept in the DOM because MediaPipe needs a real playing video element, but
     never shown: this window exists only to turn frames into events. */
  /* 窗口本身是透明的且藏在菜单栏上方，所以这里让 video 撑满、不透明度归零：
     既保证浏览器认为它"在播"（1x1 或 display:none 会让解码停掉，而 MediaPipe 要的
     就是一个真在播的 video），又不会在窗口露出的那一条边上显示画面。 */
  #cam { width: 320px; height: 240px; transform: scaleX(-1); opacity: 0; }
</style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <!-- MediaPipe 缺失时必须说出来。第一次 clone 后如果 vendor 步骤没跑,这两个 script
       会 404,而后果是"勾了开启摄像头手势但摄像头不亮"、面板上一句话都没有 ——
       用户看到的和"摄像头坏了"一模一样。 -->
  <script src="vendor/mediapipe/camera_utils/camera_utils.js"
          onerror="window.__mpMissing = 'camera_utils'"></script>
  <script src="vendor/mediapipe/hands/hands.js"
          onerror="window.__mpMissing = 'hands'"></script>
  <!-- AirCursor 的手势判定。取自 ../public/，由 fetch-vendor.sh 拷进来；
       这边只读不改，要改改源头。 -->
  <script src="vendor/aircursor/pose.js"></script>
  <script src="vendor/aircursor/motion.js"></script>
  <script src="vendor/aircursor/tracking.js"></script>
  <script src="system.js"></script>
  <script src="templates.js"></script>
  <script src="input.js"></script>
  <script src="recorder.js"></script>
  <script src="sensor.js"></script>
</body>
</html>
