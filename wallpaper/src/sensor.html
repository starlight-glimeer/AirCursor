<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GestureWall Sensor</title>
<style>
  body { margin: 0; background: #111; }
  /* Kept in the DOM because MediaPipe needs a real playing video element, but
     never shown: this window exists only to turn frames into events. */
  #cam { width: 320px; height: 240px; transform: scaleX(-1); }
</style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <script src="vendor/mediapipe/camera_utils/camera_utils.js"></script>
  <script src="vendor/mediapipe/hands/hands.js"></script>
  <!-- AirCursor 的手势判定。取自 ../public/，由 fetch-vendor.sh 拷进来；
       这边只读不改，要改改源头。 -->
  <script src="vendor/aircursor/pose.js"></script>
  <script src="vendor/aircursor/motion.js"></script>
  <script src="vendor/aircursor/tracking.js"></script>
  <script src="templates.js"></script>
  <script src="input.js"></script>
  <script src="recorder.js"></script>
  <script src="sensor.js"></script>
</body>
</html>
