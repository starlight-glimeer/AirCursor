<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GestureWall Overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* 整层鼠标穿透。主进程也设了 setIgnoreMouseEvents，两边都做是因为它们防的是不同的
     东西：CSS 管这个文档内的元素，Electron 那个管整个窗口对系统的行为。 */
  body { pointer-events: none; cursor: default; }
  #hands { position: fixed; inset: 0; }

  /* 录制时的提示条。骨架告诉你手在哪，这个告诉你现在该做什么 —— 录制的时候
     dashboard 可能被壁纸挡住或者不在视线里，而"保持不动"这类指令必须看得见。 */
  #banner {
    position: fixed; left: 50%; top: 46px; transform: translateX(-50%);
    display: none; align-items: center; gap: 12px;
    padding: 11px 20px; border-radius: 12px;
    background: rgba(12,10,8,.82); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,180,84,.34);
    font: 500 13px/1.5 -apple-system, "PingFang SC", sans-serif;
    color: #ffe8c4; white-space: nowrap;
  }
  #banner.on { display: flex; }
  #banner .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff8b4a;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  #banner b { color: #fff; }
  #banner .phase { color: rgba(255,232,196,.66); font-size: 12px; }
  #banner .count {
    font: 600 20px/1 ui-monospace, monospace; color: #fff;
    min-width: 1.2em; text-align: center;
  }
  #banner .track {
    width: 96px; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,.16); overflow: hidden;
  }
  #banner .track i {
    display: block; height: 100%; width: 0; border-radius: 2px;
    background: #ffb454; transition: width .1s linear;
  }
</style>
</head>
<body>
  <canvas id="hands"></canvas>
  <div id="banner">
    <span class="dot"></span>
    <span><b id="banner-action">录制中</b> <span class="phase" id="banner-phase"></span></span>
    <span class="count" id="banner-count"></span>
    <span class="track"><i id="banner-fill"></i></span>
  </div>

  <script src="system.js"></script>
  <script src="templates.js"></script>
  <script src="overlay.js"></script>
  <script src="overlay-window.js"></script>
</body>
</html>
